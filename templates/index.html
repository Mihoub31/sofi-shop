    function t(key,vars={}){
      let value=(I18N[lang]&&I18N[lang][key])||I18N.fr[key]||key;

    function filterProducts(){
      let list=[...state.products];
      const q=shopFilters.query.trim().toLowerCase();
      if(q)list=list.filter(p=>`${tr(p)} ${p.brand} ${tr(p,"desc")} ${categoryName(p.category)}`.toLowerCase().includes(q));
      if(shopFilters.category==="promotions")list=list.filter(p=>p.compareAt>p.price);
      else if(shopFilters.category)list=list.filter(p=>p.category===shopFilters.category);
      if(shopFilters.brand)list=list.filter(p=>p.brand===shopFilters.brand);
      if(shopFilters.availability==="in")list=list.filter(p=>p.stock>0);
      if(shopFilters.availability==="low")list=list.filter(p=>p.stock>0&&p.stock<=5);
      if(shopFilters.availability==="out")list=list.filter(p=>p.stock===0);
      if(shopFilters.minPrice!=="")list=list.filter(p=>p.price>=Number(shopFilters.minPrice));
      if(shopFilters.maxPrice!=="")list=list.filter(p=>p.price<=Number(shopFilters.maxPrice));
      if(shopFilters.sort==="price-asc")list.sort((a,b)=>a.price-b.price);
      else if(shopFilters.sort==="price-desc")list.sort((a,b)=>b.price-a.price);
      else if(shopFilters.sort==="new")list.sort((a,b)=>Number(b.isNew)-Number(a.isNew));
      else list.sort((a,b)=>Number(b.featured)-Number(a.featured)||b.rating-a.rating);
      return list;
    }

    function cartCount(){return state.cart.reduce((s,l)=>s+l.quantity,0)}
    function updateHeaderBadges(){document.getElementById("cartCount").textContent=cartCount()}
    function addToCart(id,mode="retail",quantity=1){
      const p=state.products.find(x=>x.id===id);if(!p||p.stock<=0){toast(t("outOfStock"),"error");return false}
      const existing=state.cart.find(l=>l.productId===id&&l.mode===mode);
      const newQty=(existing?.quantity||0)+quantity;
      if(newQty>p.stock){toast(t("stockUpdated"),"error");return false}
      if(existing)existing.quantity=newQty;else state.cart.push({productId:id,mode,quantity});
      persist();renderCartDrawer();updateHeaderBadges();toast(t("addedToCart"));return true;
    }
    function updateCartQuantity(id,mode,delta){
      const line=state.cart.find(l=>l.productId===id&&l.mode===mode);if(!line)return;
      const p=state.products.find(x=>x.id===id);if(!p)return;
      const min=1;
      line.quantity=Math.max(min,Math.min(p.stock,line.quantity+delta));
      persist();renderCartDrawer();updateHeaderBadges();
    }
    function removeCartLine(id,mode){state.cart=state.cart.filter(l=>!(l.productId===id&&l.mode===mode));persist();renderCartDrawer();updateHeaderBadges()}
    function couponDefinition(code){return state.promos.find(p=>p.active&&p.code.toUpperCase()===String(code||"").trim().toUpperCase())}
    function packRate(maxPrice){return maxPrice<=1000?0.30:maxPrice<=5000?0.25:0.20}
    function packDiscountFor(cart){
      let qty=0,sum=0,max=0;
      cart.forEach(l=>{if(l.mode!=="pack")return;const p=state.products.find(x=>x.id===l.productId);if(!p)return;qty+=l.quantity;sum+=Number(p.price)*l.quantity;max=Math.max(max,Number(p.price))});
      return qty>=3?Math.round(sum*packRate(max)*100)/100:0;
    }
    var packSel={};
    function packSectionHTML(){return `<section class="section-sm"><div class="container"><div style="border:1px solid var(--beige);background:var(--pink-50);border-radius:26px;padding:30px;display:grid;gap:14px;text-align:center"><span class="eyebrow" style="justify-content:center">Offre spéciale</span><h2 class="section-title"><span class="pack-gift" aria-hidden="true">🎁</span> Crée ton Pack <span aria-hidden="true">✨</span></h2><p class="muted" style="font-size:13px;max-width:600px;margin:0 auto">Choisis au moins 3 articles et profite d'une remise sur le total : <strong>30 %</strong> si chaque article coûte 1 000 DA ou moins, <strong>25 %</strong> si le plus cher est entre 1 000 et 5 000 DA, <strong>20 %</strong> au-dessus de 5 000 DA.</p><div><button class="btn btn-primary" type="button" data-pack-open>Composer mon pack</button></div></div></div></section>`}
    function renderHome(){return renderHomeBase().replace("</section>",m=>m+packSectionHTML())}
    function renderPackBuilder(){
      const box=document.getElementById("packBuilder");if(!box)return;
      const items=state.products.filter(p=>p.stock>0);
      let qty=0,sum=0,max=0;
      items.forEach(p=>{const q=packSel[p.id]||0;if(q>0){qty+=q;sum+=q*Number(p.price);max=Math.max(max,Number(p.price))}});
      const ok=qty>=3,rate=packRate(max),disc=ok?Math.round(sum*rate*100)/100:0;
      const rows=items.map(p=>`<div class="summary-line" style="align-items:center;gap:10px"><img src="${safeImage(p.image)}" alt="" style="width:44px;height:44px;border-radius:10px;object-fit:cover"><span style="flex:1;font-size:12px">${esc(tr(p))}<br><small class="muted">${money(p.price)}</small></span><span style="display:flex;align-items:center;gap:8px"><button type="button" class="btn btn-outline btn-sm" data-pack-dec="${esc(p.id)}">−</button><strong>${packSel[p.id]||0}</strong><button type="button" class="btn btn-outline btn-sm" data-pack-inc="${esc(p.id)}">+</button></span></div>`).join("");
      const remiseTxt=ok?"−"+money(disc):(qty>0?"Encore "+(3-qty)+" article(s)":"3 articles minimum");
      box.innerHTML=`<div style="max-height:46vh;overflow:auto;display:grid;gap:8px">${rows}</div><div style="margin-top:14px;padding:14px;border:1px solid var(--beige);border-radius:14px;background:var(--pink-50)"><div class="summary-line"><span>Articles</span><strong>${qty}</strong></div><div class="summary-line"><span>Total</span><strong>${money(sum)}</strong></div><div class="summary-line"><span>${ok?"Remise "+Math.round(rate*100)+"%":"Remise"}</span><strong>${remiseTxt}</strong></div><div class="summary-line total"><span>Total du pack</span><strong>${money(sum-disc)}</strong></div></div><button type="button" class="btn btn-primary btn-block" style="margin-top:12px" data-pack-add ${ok?"":"disabled"}>Ajouter le pack au panier</button>`;
    }
    document.addEventListener("click",e=>{
      if(e.target.closest("[data-pack-open]")){packSel={};showModal("🎁 Crée ton Pack",'<div id="packBuilder"></div>',"","lg");renderPackBuilder();return}
      const inc=e.target.closest("[data-pack-inc]");
      if(inc){const id=inc.dataset.packInc,p=state.products.find(x=>x.id===id);if(p){packSel[id]=Math.min(p.stock,(packSel[id]||0)+1);renderPackBuilder()}return}
      const dec=e.target.closest("[data-pack-dec]");
      if(dec){const id=dec.dataset.packDec;packSel[id]=Math.max(0,(packSel[id]||0)-1);renderPackBuilder();return}
      const add=e.target.closest("[data-pack-add]");
      if(add&&!add.disabled){
        const sel=Object.entries(packSel).filter(([,q])=>q>0);
        const qty=sel.reduce((s,[,q])=>s+q,0);
        if(qty<3){toast("Choisissez au moins 3 articles","error");return}
        for(const [id,q] of sel){
          const p=state.products.find(x=>x.id===id);
          const inCart=state.cart.filter(l=>l.productId===id).reduce((s,l)=>s+l.quantity,0);
          if(!p||inCart+q>p.stock){toast(t("stockUpdated"),"error");return}
        }
        sel.forEach(([id,q])=>{const ex=state.cart.find(l=>l.productId===id&&l.mode==="pack");if(ex)ex.quantity+=q;else state.cart.push({productId:id,mode:"pack",quantity:q})});
        persist();closeModal();renderCartDrawer();updateHeaderBadges();toast(t("addedToCart"));
      }
    });
    function couponDiscount(subtotal,code=appliedCoupon){
      const c=couponDefinition(code);if(!c||subtotal<c.min)return 0;
      let value=c.type==="percent"?subtotal*c.value/100:Number(c.value);
      if(c.maxDiscount)value=Math.min(value,c.maxDiscount);
      return Math.min(value,subtotal);
    }
    function cartTotals(wilaya="",method="home",code=appliedCoupon){
      let retailSubtotal=0,subtotal=0,savings=0;
      state.cart.forEach(line=>{
        const p=state.products.find(x=>x.id===line.productId);if(!p)return;
        const u=unitPrice(p,line.mode,line.quantity);
        retailSubtotal+=p.price*line.quantity;subtotal+=u*line.quantity;savings+=(p.price-u)*line.quantity;
      });
      const packDiscount=packDiscountFor(state.cart);const discount=couponDiscount(subtotal-packDiscount,code);
      let shipping=0,known=!!wilaya;
      if(wilaya){
        const d=state.settings.delivery[wilaya];
        if(d){
          const useRelay=method==="pickup"&&d.relayAvailable;
          shipping=useRelay?Number(d.relay):Number(d.home);
          if(subtotal-packDiscount-discount>=Number(state.settings.freeShippingThreshold||0))shipping=0;
        }
      }
      return {retailSubtotal,subtotal,savings,couponDiscount:discount,packDiscount,shipping,shippingKnown:known,total:Math.max(0,subtotal-packDiscount-discount+shipping)};
    }

      }
      content.innerHTML=state.cart.map(line=>{
        const p=state.products.find(x=>x.id===line.productId);if(!p)return "";
        const u=unitPrice(p,line.mode,line.quantity);
        return `<div class="cart-item"><img src="${safeImage(p.image)}" alt="${esc(tr(p))}"><div><span class="brand">${esc(p.brand)}</span><h3>${esc(tr(p))}</h3><span class="badge badge-pink">${t("retail")}</span><div style="margin-top:9px"><div class="qty-control"><button data-cart-dec="${p.id}|${line.mode}">−</button><span>${line.quantity}</span><button data-cart-inc="${p.id}|${line.mode}">+</button></div></div></div><div class="cart-item-side"><strong>${money(u*line.quantity)}</strong><div class="small muted">${money(u)} / ${t("unitPrice")}</div><button class="remove-btn" data-cart-remove="${p.id}|${line.mode}">${t("remove")}</button></div></div>`;
      }).join("");
      const totals=cartTotals(cartWilaya,cartMethod);
      const d=cartWilaya?state.settings.delivery[cartWilaya]:null;
      footer.innerHTML=`<div class="delivery-mini"><select id="cartWilaya"><option value="">${t("selectWilaya")}</option>${wilayas.map(w=>`<option value="${w.code}" ${cartWilaya===w.code?"selected":""}>${esc(lang==="ar"?w.ar:w.fr)}</option>`).join("")}</select><select id="cartMethod"><option value="home" ${cartMethod==="home"?"selected":""}>${t("homeDelivery")}</option><option value="pickup" ${cartMethod==="pickup"?"selected":""} ${d&&!d.relayAvailable?"disabled":""}>${t("pickup")}</option></select></div>
      <div class="summary-line"><span>${t("subtotal")}</span><strong>${money(totals.subtotal)}</strong></div>

      ${totals.packDiscount?`<div class="summary-line" style="color:var(--success)"><span>Remise Pack</span><strong>−${money(totals.packDiscount)}</strong></div>`:""}${totals.couponDiscount?`<div class="summary-line" style="color:var(--success)"><span>${t("couponDiscount")}</span><strong>−${money(totals.couponDiscount)}</strong></div>`:""}
      <div class="summary-line"><span>${t("shipping")}</span><strong>${totals.shippingKnown?(totals.shipping===0?t("free"):money(totals.shipping)):t("selectWilaya")}</strong></div>
      <div class="summary-line total"><span>${t("grandTotal")}</span><strong>${money(totals.total)}</strong></div>
      <div class="coupon-row"><input id="cartCoupon" value="${esc(appliedCoupon)}" placeholder="${t("couponPlaceholder")}"><button class="btn btn-soft btn-sm" data-apply-coupon="cart">${t("apply")}</button></div>
      <button class="btn btn-primary btn-block" data-checkout>${t("checkout")} ${icon("arrow-right")}</button>`;
      refreshIcons();
    }

    async function createOrder(form){
      const fd=new FormData(form),wilaya=fd.get("wilaya"),method=fd.get("delivery"),payment=fd.get("payment");
      if(!wilaya||!fd.get("commune")||!method||!payment){toast(t("requiredFields"),"error");return}
      const d=state.settings.delivery[wilaya];
      if(method==="pickup"&&!d?.relayAvailable){toast(t("pickupUnavailable"),"error");return}
      for(const line of state.cart){
        const p=state.products.find(x=>x.id===line.productId);
        if(!p||p.stock<line.quantity){toast(t("stockUpdated"),"error");return}
      }
      if(!state.cart.length){toast(t("stockUpdated"),"error");return}
      const totals=cartTotals(wilaya,method);
      const date=new Date(),stamp=`${String(date.getFullYear()).slice(-2)}${String(date.getMonth()+1).padStart(2,"0")}${String(date.getDate()).padStart(2,"0")}`;
      const ref=`SS-${stamp}-${Math.random().toString(36).slice(2,6).toUpperCase()}`;
      const order={id:"order_"+Date.now(),ref,createdAt:new Date().toISOString(),status:"pending",demo:false,customer:{name:fd.get("name"),phone:fd.get("phone"),email:"",wilaya,commune:fd.get("commune"),address:fd.get("address"),note:fd.get("note")||""},delivery:{method,fee:totals.shipping,company:fd.get("company")||""},payment,items:state.cart.map(l=>{const p=state.products.find(x=>x.id===l.productId),u=unitPrice(p,l.mode,l.quantity);return{productId:p.id,name:tr(p),qty:l.quantity,mode:l.mode,unitPrice:u,retailPrice:p.price,total:u*l.quantity}}),totals};
      try{
        const response=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(order)});
        const result=await response.json().catch(()=>({}));
        if(!response.ok){toast(result.error||"Enregistrement impossible. Réessayez.","error");return}
        state.orders.unshift(order);state.lastOrderId=order.id;state.cart=[];appliedCoupon="";persist();navigate("order");toast(t("orderPlaced"));
      }catch(err){
        toast("Connexion au serveur impossible. Votre panier est conservé.","error");
      }
    }

    document.addEventListener("click",async e=>{
      const shopCategory=e.target.closest("[data-shop-category]");
      if(shopCategory){
        e.preventDefault();shopFilters.category=shopCategory.dataset.shopCategory;
        if(location.hash==="#shop")renderCurrentPage();else location.hash="shop";return;
      }
      const routeLink=e.target.closest("[data-route]");
      if(routeLink){e.preventDefault();navigate(routeLink.dataset.route);return}
      if(e.target.closest("#accountButton")){openAccountModal();return}
      if(e.target.closest("#cartButton")||e.target.closest("[data-cart-open]")){openCart();return}
      if(e.target.closest("[data-cart-close]")||e.target.id==="cartOverlay"){closeCart();return}
      if(e.target.closest("[data-modal-close]")){closeModal();return}
      if(e.target.id==="modalOverlay"){closeModal();return}
      const openProductBtn=e.target.closest("[data-open-product]");if(openProductBtn){openProduct(openProductBtn.dataset.openProduct);return}
      const addProductBtn=e.target.closest("[data-add-product]");if(addProductBtn){addToCart(addProductBtn.dataset.addProduct,"retail",1);return}
      const modeBtn=e.target.closest("[data-pmode]");
      if(modeBtn){
        productModalState.mode=modeBtn.dataset.pmode;const p=state.products.find(x=>x.id===productModalState.id);
        productModalState.qty=Math.max(1,productModalState.qty);
        refreshProductPurchase();return;
      }
      if(e.target.closest("[data-product-inc]")||e.target.closest("[data-product-dec]")){
        const p=state.products.find(x=>x.id===productModalState.id),delta=e.target.closest("[data-product-inc]")?1:-1;
        productModalState.qty=Math.max(1,Math.min(p.stock,productModalState.qty+delta));refreshProductPurchase();return;
      }
      if(e.target.closest("[data-add-configured]")){
        const p=state.products.find(x=>x.id===productModalState.id);
        if(addToCart(p.id,productModalState.mode,productModalState.qty)){closeModal();openCart()}return;
      }
      const inc=e.target.closest("[data-cart-inc]"),dec=e.target.closest("[data-cart-dec]"),rem=e.target.closest("[data-cart-remove]");
      if(inc){const [id,mode]=inc.dataset.cartInc.split("|");updateCartQuantity(id,mode,1);return}
      if(dec){const [id,mode]=dec.dataset.cartDec.split("|");updateCartQuantity(id,mode,-1);return}
      if(rem){const [id,mode]=rem.dataset.cartRemove.split("|");removeCartLine(id,mode);return}
      if(e.target.closest("[data-checkout]")){if(state.cart.length){navigate("checkout")}else toast(t("emptyCart"),"error");return}
      const apply=e.target.closest("[data-apply-coupon]");
      if(apply){
        const input=document.getElementById(apply.dataset.applyCoupon==="cart"?"cartCoupon":"checkoutCoupon");
        const code=input?.value.trim().toUpperCase()||"",c=couponDefinition(code),sub=cartTotals().subtotal;
        if(c&&sub>=c.min){appliedCoupon=code;toast(t("codeApplied"));renderCartDrawer();if(apply.dataset.applyCoupon==="checkout")updateCheckoutSummary()}
        else{appliedCoupon="";toast(t("invalidCode"),"error");renderCartDrawer();if(apply.dataset.applyCoupon==="checkout")updateCheckoutSummary()}return;
      }
      if(e.target.closest("[data-show-guide]")){e.preventDefault();showGuide();return}
      const accountTab=e.target.closest("[data-account-tab]");
      if(accountTab){
        document.querySelectorAll("[data-account-tab]").forEach(b=>b.classList.toggle("active",b===accountTab));
        document.getElementById("accountTabCustomer").hidden=accountTab.dataset.accountTab!=="customer";
        document.getElementById("accountTabAdmin").hidden=accountTab.dataset.accountTab!=="admin";return;
      }
      if(e.target.closest("[data-customer-logout]")){customerPhone="";openAccountModal();return}
      const tab=e.target.closest("[data-admin-tab]");
      if(tab){adminTab=tab.dataset.adminTab;renderCurrentPage();return}
      if(e.target.closest("[data-admin-logout]")){
        fetch("/api/admin/logout",{method:"POST",headers:{"Content-Type":"application/json"}})
          .catch(()=>{})
          .finally(()=>{adminSession=false;renderCurrentPage();toast(t("logout"))});
        return;
      }
      if(e.target.closest("[data-new-product]")){openProductEditor();return}
      const editProduct=e.target.closest("[data-edit-product]");if(editProduct){openProductEditor(editProduct.dataset.editProduct);return}
      const deleteProduct=e.target.closest("[data-delete-product]");
      if(deleteProduct&&await confirmDialog(t("confirmDelete"),t("confirmDeleteText"))){const _pid=deleteProduct.dataset.deleteProduct;fetch("/api/admin/products/"+encodeURIComponent(_pid),{method:"DELETE"}).then(r=>{if(!r.ok)throw 0;state.products=state.products.filter(p=>p.id!==_pid);state.cart=state.cart.filter(l=>l.productId!==_pid);persist();renderAdminMain();renderCartDrawer();toast(t("deleteSuccess"))}).catch(()=>toast("Suppression impossible","error"));return}
      const viewOrder=e.target.closest("[data-view-order]");if(viewOrder){openOrderDetails(viewOrder.dataset.viewOrder);return}
      const editDelivery=e.target.closest("[data-edit-delivery]");if(editDelivery){openDeliveryEditor(editDelivery.dataset.editDelivery);return}
      const clientSegment=e.target.closest("[data-client-segment]");if(clientSegment){clientSegment=clientSegment.dataset.clientSegment;renderAdminMain();return}
      const editCustomer=e.target.closest("[data-edit-customer]");if(editCustomer){openCustomerEditor(editCustomer.dataset.editCustomer);return}
      const deleteLead=e.target.closest("[data-delete-lead]");if(deleteLead&&await confirmDialog(t("confirmDelete"),t("confirmDeleteText"))){state.leads=state.leads.filter(l=>l.id!==deleteLead.dataset.deleteLead);persist();renderAdminMain();toast(t("deleteSuccess"));return}
      const deletePromo=e.target.closest("[data-delete-promo]");if(deletePromo){state.promos=state.promos.filter(p=>p.id!==deletePromo.dataset.deletePromo);appliedCoupon="";persist();renderAdminMain();renderCartDrawer();toast(t("deleteSuccess"));return}

      const gallery=e.target.closest("[data-gallery-image]");
      if(gallery){document.getElementById("pImage").value=gallery.dataset.galleryImage;document.getElementById("imagePreview").innerHTML=`<img src="${safeImage(gallery.dataset.galleryImage)}" style="width:90px;height:90px;object-fit:cover;border-radius:12px">`;document.querySelectorAll("[data-gallery-image]").forEach(b=>b.classList.toggle("active",b===gallery));return}
      if(e.target.closest("[data-print]")){window.print();return}
      const copy=e.target.closest("[data-copy]");
      if(copy){navigator.clipboard?.writeText(copy.dataset.copy).then(()=>toast(t("copied"))).catch(()=>toast(copy.dataset.copy));return}
      if(e.target.closest("#clearFilters")){shopFilters={query:"",category:"",brand:"",availability:"",minPrice:"",maxPrice:"",sort:"featured"};renderCurrentPage();return}
      if(e.target.closest("#mobileToggle")){document.getElementById("mobileMenu").classList.toggle("open");return}
    });

    document.addEventListener("input",e=>{
      if(e.target.id==="shopSearch"){shopFilters.query=e.target.value;updateShopResults()}
      if(e.target.id==="adminDeliverySearch"){deliverySearch=e.target.value;const list=wilayas.filter(w=>(lang==="ar"?w.ar:w.fr).toLowerCase().includes(deliverySearch.toLowerCase()));const body=document.getElementById("deliveryTableBody");if(body)body.innerHTML=deliveryTableRows(list)}
    });
    document.addEventListener("change",e=>{
      if(e.target.id==="languageSelector"){lang=e.target.value;state.settings.language=lang;persist();applyTranslations();renderCurrentPage();return}
      if(e.target.id==="filterCategory"){shopFilters.category=e.target.value;updateShopResults()}
      if(e.target.id==="filterBrand"){shopFilters.brand=e.target.value;updateShopResults()}
      if(e.target.id==="filterAvailability"){shopFilters.availability=e.target.value;updateShopResults()}
      if(e.target.id==="filterSort"){shopFilters.sort=e.target.value;updateShopResults()}
      if(e.target.id==="filterMin"){shopFilters.minPrice=e.target.value;updateShopResults()}
      if(e.target.id==="filterMax"){shopFilters.maxPrice=e.target.value;updateShopResults()}
      if(e.target.id==="cartWilaya"){cartWilaya=e.target.value;renderCartDrawer()}
      if(e.target.id==="cartMethod"){cartMethod=e.target.value;renderCartDrawer()}
      if(e.target.id==="coWilaya"){updateCheckoutCommunes()}
      if(e.target.name==="delivery"){checkoutMethod=e.target.value;updateCheckoutSummary()}if(e.target.name==="company"){checkoutCompany=e.target.value}

      if(e.target.id==="adminOrderStatus"){adminOrderStatus=e.target.value;renderAdminMain()}
      if(e.target.dataset.orderStatus){const o=state.orders.find(x=>x.id===e.target.dataset.orderStatus);if(o){o.status=e.target.value;fetch("/api/admin/orders/"+encodeURIComponent(o.id)+"/status",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:o.status})}).then(r=>{if(!r.ok)toast("Statut non enregistré","error")}).catch(()=>toast("Statut non enregistré","error"));persist();toast(t("saveSuccess"));renderAdminMain()}}
      if(e.target.dataset.leadStatus){const l=state.leads.find(x=>x.id===e.target.dataset.leadStatus);if(l){l.status=e.target.value;persist();toast(t("saveSuccess"))}}
      if(e.target.dataset.promoToggle){const p=state.promos.find(x=>x.id===e.target.dataset.promoToggle);if(p){p.active=e.target.checked;persist();toast(t("saveSuccess"))}}
      if(e.target.id==="pImage"){const p=document.getElementById("imagePreview");if(p)p.innerHTML=`<img src="${safeImage(e.target.value)}" style="width:90px;height:90px;object-fit:cover;border-radius:12px">`}
    });

    document.addEventListener("submit",async e=>{
      e.preventDefault();const form=e.target,id=form.id,fd=new FormData(form);
      if(id==="headerSearchForm"||id==="mobileSearchForm"){
        const input=document.getElementById(id==="headerSearchForm"?"headerSearchInput":"mobileSearchInput");
        shopFilters.query=input.value.trim();location.hash="shop";if(location.hash==="#shop")renderCurrentPage();return;
      }
      if(id==="customerLoginForm"){
        if(String(fd.get("phone")).replace(/\s/g,"")==="0555123456"&&fd.get("password")==="client"){customerPhone=fd.get("phone");openAccountModal();toast(t("signIn"))}else toast(t("invalidLogin"),"error");return;
      }
      if(id==="adminLoginForm"){
        try{
          const response=await fetch("/api/admin/login",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
              email:fd.get("email"),
              password:fd.get("password")
            })
          });
          const result=await response.json().catch(()=>({}));
          if(!response.ok){
            toast(result.error||t("invalidLogin"),"error");
            return;
          }
          adminSession=true;loadServerOrders();
          closeModal();
          navigate("admin");
          toast(t("signIn"));
        }catch(err){
          toast("Connexion au serveur impossible.","error");
        }
        return;
      }
      if(id==="checkoutForm"){createOrder(form);return}
      if(id==="wholesaleRequestForm"){
        state.leads.unshift({id:"lead_"+Date.now(),company:fd.get("company"),name:fd.get("name"),phone:fd.get("phone"),email:fd.get("email"),wilaya:fd.get("wilaya"),volume:fd.get("volume"),message:fd.get("message"),createdAt:new Date().toISOString(),status:"new",demo:true});persist();form.reset();toast(t("requestSent"));const panel=document.getElementById("wholesaleForm");if(panel)panel.insertAdjacentHTML("afterbegin",`<div class="demo-ribbon" style="margin-bottom:15px">${icon("check")}<span>${t("requestSent")}</span></div>`);return;
      }
      if(id==="productEditorForm"){
        const existingId=fd.get("id");
        const item={id:existingId||"p_"+Date.now(),name:{fr:fd.get("name_fr"),ar:fd.get("name_ar"),en:fd.get("name_en")},brand:fd.get("brand"),category:fd.get("category"),desc:{fr:fd.get("desc_fr"),ar:fd.get("desc_ar"),en:fd.get("desc_en")},price:Number(fd.get("price")),compareAt:Number(fd.get("compareAt")||0),stock:Number(fd.get("stock")),image:fd.get("image"),featured:fd.has("featured"),isNew:fd.has("isNew"),rating:existingId?state.products.find(p=>p.id===existingId)?.rating||5:5,reviews:existingId?state.products.find(p=>p.id===existingId)?.reviews||0:0,demo:true};
        const _isEdit=!!existingId;fetch("/api/admin/products"+(_isEdit?"/"+encodeURIComponent(existingId):""),{method:_isEdit?"PUT":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(item)}).then(r=>r.json().then(j=>({ok:r.ok,j:j}))).then(res=>{if(!res.ok){toast(res.j.error||"Enregistrement impossible","error");return}const sv=res.j.product||item;if(_isEdit)state.products=state.products.map(p=>p.id===existingId?sv:p);else state.products.unshift(sv);persist();closeModal();renderAdminMain();toast(t("newProductsSaved"))}).catch(()=>toast("Connexion au serveur impossible","error"));return;
      }
      if(id==="promotionForm"){
        state.promos.push({id:"promo_"+Date.now(),code:String(fd.get("code")).toUpperCase(),type:fd.get("type"),value:Number(fd.get("value")),min:Number(fd.get("min")||0),maxDiscount:Number(fd.get("max")||0),active:true});persist();form.reset();renderAdminMain();toast(t("saveSuccess"));return;
      }
      if(id==="deliveryGlobalForm"){state.settings.freeShippingThreshold=Number(fd.get("freeShipping")||0);persist();renderAdminMain();toast(t("saveSuccess"));return}
      if(id==="deliveryEditorForm"){
        const code=fd.get("code"),d=state.settings.delivery[code];d.home=Number(fd.get("home"));d.relay=Number(fd.get("relay"));d.relayAvailable=fd.has("relayAvailable");d.communes=String(fd.get("communes")).split(/[\n,]+/).map(x=>x.trim()).filter(Boolean);persist();closeModal();renderAdminMain();toast(t("saveSuccess"));return;
      }
      if(id==="customerEditorForm"){state.customerProfiles[fd.get("phone")]={name:fd.get("name"),type:fd.get("type"),note:fd.get("note")};persist();closeModal();renderAdminMain();toast(t("saveSuccess"));return}
      if(id==="adminSettingsForm"){
        state.settings.slogan=fd.get("slogan");state.settings.whatsapp=fd.get("whatsapp");state.settings.email=fd.get("email");state.settings.phone=fd.get("phone");state.settings.address=fd.get("address");state.settings.codEnabled=fd.has("codEnabled");persist();document.getElementById("floatingWhatsapp").href=whatsappLink();renderAdminMain();toast(t("saveSuccess"));return;
      }
      if(id==="newsletterForm"){form.reset();toast(t("newsletterSuccess"))}
    });

    document.addEventListener("error",e=>{if(e.target.tagName==="IMG"&&!e.target.dataset.fallback){e.target.dataset.fallback="1";e.target.src=placeholderImage}},true);
    window.addEventListener("hashchange",()=>{renderCurrentPage();window.scrollTo({top:0,behavior:"smooth"})});
    /* cartCloseSafety */
    document.addEventListener("click",function(e){
      var d=document.getElementById("cartDrawer");
      if(!d||!d.classList.contains("open"))return;
      var b=d.querySelector("[data-cart-close]");
      var hit=e.target.id==="cartOverlay"||(e.target.closest&&e.target.closest("[data-cart-close]"));
      if(!hit&&b){
        var r=b.getBoundingClientRect();
        hit=e.clientX>=r.left-6&&e.clientX<=r.right+6&&e.clientY>=r.top-6&&e.clientY<=r.bottom+6;
      }
      if(hit){e.stopPropagation();closeCart()}
    },true);
    document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal();closeCart()}});

    document.getElementById("currentYear").textContent=new Date().getFullYear();
    document.getElementById("headerCategories").innerHTML=categories.map(c=>`<a href="#shop" data-shop-category="${c.slug}">${esc(tr(c))}</a>`).join("");
    document.getElementById("floatingWhatsapp").href=whatsappLink();
    if(!location.hash)history.replaceState(null,"","#home");
    applyTranslations();renderCurrentPage();
  })();
  </script>
<script>
(function(){
  var K="sofi_theme",r=document.documentElement;
  var b=document.createElement("button");b.id="themeToggle";b.type="button";
  function apply(m){
    r.setAttribute("data-theme",m);
    try{localStorage.setItem(K,m)}catch(e){}
    b.textContent=m==="dark"?"\u2600\uFE0F":"\uD83C\uDF19";
    b.setAttribute("aria-label",m==="dark"?"Mode clair":"Mode sombre");
  }
  b.onclick=function(){apply(r.getAttribute("data-theme")==="dark"?"light":"dark")};
  document.body.appendChild(b);
  apply(r.getAttribute("data-theme")||"light");
})();
</script>
<script>
(function(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches||!("IntersectionObserver" in window))return;
  var io=new IntersectionObserver(function(es){es.forEach(function(e){
    if(!e.isIntersecting)return;
    var el=e.target;io.unobserve(el);el.classList.add("pc-in");
    setTimeout(function(){el.classList.remove("pc-reveal","pc-in");el.style.transitionDelay=""},900);
  })},{threshold:.12});
  var n=0;
  function scan(){document.querySelectorAll(".product-card:not([data-rv])").forEach(function(el){
    el.setAttribute("data-rv","1");el.classList.add("pc-reveal");
    el.style.transitionDelay=((n++)%4)*90+"ms";io.observe(el);
  })}
  new MutationObserver(function(){n=0;scan()}).observe(document.body,{childList:true,subtree:true});
  scan();
})();
</script>
</body>
